<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>登录 · <%= title %></title>
    <link rel="icon" type="image/png" href="/images/logo.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body, #app { height: 100%; }
      body { font-family: 'IBM Plex Sans', system-ui, sans-serif; }
    </style>
  </head>
  <body>
    <!-- Fast-path redirect: if already authenticated skip the login page entirely. -->
    <script>
      (function () {
        if (localStorage.getItem("smartai_admin_token")) {
          var params = new URLSearchParams(window.location.search);
          var redirect = params.get("redirect") || "/#/";
          window.location.replace(redirect);
        }
      })();
    </script>
    <div id="app">
      <style>
        @keyframes fadeIn {
          from { opacity: .01; }
          to { opacity: 1; }
        }
        @keyframes slideIn {
          from { transform: translateY(20px); }
          to { transform: translateY(0); }
        }
        @keyframes loading-track {
          0% { transform: translateX(0) scaleX(0); }
          10% { transform: translateX(0) scaleX(.2); }
          40% { transform: translateX(0) scaleX(.7); }
          60% { transform: translateX(60%) scaleX(.4); }
          100% { transform: translateX(100%) scaleX(.2); }
        }
        .loading-page {
          position: fixed;
          top: 0;
          bottom: 0;
          left: 0;
          right: 0;
          z-index: 99999;
          background-color: #fff;
          font-family: -apple-system, blinkmacsystemfont, 'Segoe UI', roboto, 'Helvetica Neue', arial, 'PingFang SC', sans-serif;
          display: flex;
          justify-content: center;
          align-items: center;
          flex-direction: column;
          opacity: .01;
          animation: .4s ease-in-out 1 forwards fadeIn;
        }
        .loading-page-inner {
          max-width: 100%;
          width: 160px;
          margin: auto;
          position: relative;
        }
        .loading-text {
          width: 100%;
          text-align: center;
          transform: translateY(20px);
          animation: .4s ease-in-out 1 forwards slideIn;
          padding-bottom: 20px;
          font-size: 20px;
          line-height: 24px;
          color: #314666;
        }
        .loading-progress {
          margin-top: 16px;
          width: 100%;
          height: 4px;
          border-radius: 4px;
          overflow: hidden;
          background-color: #f2f3f9;
          position: relative;
        }
        .loading-track {
          height: 100%;
          width: 100%;
          background-color: #1055ff;
          border-radius: 4px;
          animation: loading-track 1.3s infinite linear;
          transform-origin: 0% 50%;
        }
      </style>
      <div class="loading-page">
        <div class="loading-page-inner">
          <div class="loading-text">加载中</div>
          <div class="loading-progress">
            <div class="loading-track"></div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
